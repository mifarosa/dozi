<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dozi</title>
  <meta name="description" content="İlaç takip uygulaması: kutu, blister ve hap sayısını görsel olarak takip et.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dozi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before the first paint so a dark phone never flashes light.
    try {
      var p = JSON.parse(localStorage.getItem('dozi.prefs'));
      if (p && /^(light|dark)$/.test(p.theme)) document.documentElement.setAttribute('data-theme', p.theme);
      if (p && /^(blue|purple|rose|orange)$/.test(p.accent)) document.documentElement.setAttribute('data-accent', p.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Geri" data-i18n-aria="back" hidden>&#8592;</button>
    <h1>Do<span>zi</span></h1>
    <button id="add" class="icon-btn" aria-label="İlaç ekle" data-i18n-aria="add.aria">+</button>
  </header>

  <div id="cloud-bar" class="cloud-bar" hidden></div>

  <main>
    <div id="app"></div>

    <div class="coffee">
      <p data-i18n="coffee.text">Dozi ücretsiz ve reklamsız.</p>
      <a class="coffee-pill" href="https://buymeacoffee.com/mifarosa" target="_blank" rel="noopener">
        <span aria-hidden="true">&#9749;</span> <span data-i18n="coffee.button">Bana bir kahve ısmarla</span>
      </a>
    </div>
  </main>

  <nav class="tabbar" aria-label="Menü" data-i18n-aria="nav.label">
    <button class="tab active" data-view="meds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M9.7 8.7l4.6 6.6"/></svg>
      <span data-i18n="nav.meds">İlaçlar</span>
    </button>
    <button class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-i18n="nav.calendar">Takvim</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      <span data-i18n="nav.settings">Ayarlar</span>
    </button>
  </nav>

  <dialog id="choose-dialog">
    <h2 data-i18n="choose.title">Ne eklemek istiyorsun?</h2>
    <button type="button" class="choice" data-choose="med">
      <strong data-i18n="choose.med">Düzenli ilaç</strong>
      <span data-i18n="choose.med.sub">Kutu, blister ve hap sayısını takip et</span>
    </button>
    <button type="button" class="choice" data-choose="extra">
      <strong data-i18n="choose.extra">Günlük kayıt</strong>
      <span data-i18n="choose.extra.sub">Vitamin, bitki çayı gibi bir şey içtim</span>
    </button>
    <button type="button" class="choice" id="choose-backfill" data-choose="backfill">
      <strong data-i18n="choose.backfill">Unutulan doz</strong>
      <span data-i18n="choose.backfill.sub">Geçmiş bir güne ilaç ekle</span>
    </button>
    <div class="actions">
      <button type="button" id="choose-cancel" class="btn ghost" data-i18n="cancel">Vazgeç</button>
    </div>
  </dialog>

  <dialog id="form-dialog">
    <form id="med-form" method="dialog">
      <h2 id="form-title" data-i18n="form.new">Yeni ilaç</h2>

      <label><span data-i18n="form.name">İlaç adı</span>
        <input name="name" required maxlength="40" placeholder="Örn. Vitamin D" data-i18n-placeholder="form.name.placeholder">
      </label>

      <div class="grid2">
        <label><span data-i18n="form.blisters">Kutuda kaç blister?</span>
          <input name="blisters" type="number" min="1" max="50" value="2" required inputmode="numeric">
        </label>
        <label><span data-i18n="form.perBlister">Blisterde kaç hap?</span>
          <input name="perBlister" type="number" min="1" max="100" value="14" required inputmode="numeric">
        </label>
      </div>

      <fieldset>
        <legend data-i18n="form.position">Kaldığın yer</legend>
        <div class="grid2">
          <label><span data-i18n="form.curBlister">Kullandığım blister</span>
            <input name="curBlister" type="number" min="1" value="1" required inputmode="numeric">
          </label>
          <label><span data-i18n="form.curPill">Kullandığım hap</span>
            <input name="curPill" type="number" min="1" value="1" required inputmode="numeric">
          </label>
        </div>
        <label><span data-i18n="form.curPart">O hapın durumu</span>
          <select name="curPart">
            <option value="0" data-i18n="form.part.0">Tam (hiç kullanılmamış)</option>
            <option value="3" data-i18n="form.part.3">¾ kaldı</option>
            <option value="2" data-i18n="form.part.2">Yarısı kaldı</option>
            <option value="1" data-i18n="form.part.1">¼ kaldı</option>
          </select>
        </label>
      </fieldset>

      <div class="grid2">
        <label><span data-i18n="form.dose">Her alışta</span>
          <select name="dose">
            <option value="1" data-i18n="dose.1">¼ hap</option>
            <option value="2" data-i18n="dose.2">Yarım hap</option>
            <option value="4" selected data-i18n="dose.4">1 hap</option>
            <option value="6" data-i18n="dose.6">1,5 hap</option>
            <option value="8" data-i18n="dose.8">2 hap</option>
          </select>
        </label>
        <label><span data-i18n="form.perDay">Günde kaç kez?</span>
          <input name="perDay" type="number" min="1" max="12" value="1" required inputmode="numeric">
        </label>
      </div>

      <fieldset>
        <legend data-i18n="form.times">Hatırlatma saatleri</legend>
        <div id="time-rows"></div>
        <button type="button" id="add-time" class="btn ghost small" data-i18n="form.addTime">+ Saat ekle</button>
        <p class="hint" data-i18n="form.timesHint">Bildirimler uygulama açıkken ya da tarayıcı arka planda canlı tutarken gelir; telefon uygulamayı tamamen kapatırsa gecikebilir.</p>
      </fieldset>

      <p id="form-error" class="error" hidden></p>

      <div class="actions sticky">
        <button type="button" id="form-cancel" class="btn ghost" data-i18n="cancel">Vazgeç</button>
        <button type="submit" class="btn primary" data-i18n="save">Kaydet</button>
      </div>
    </form>
  </dialog>

  <dialog id="backfill-dialog">
    <form id="backfill-form" method="dialog">
      <h2 data-i18n="backfill.title">Unutulan dozu ekle</h2>

      <label><span data-i18n="backfill.med">İlaç</span>
        <select name="med"></select>
      </label>
      <label><span data-i18n="day">Gün</span>
        <input name="date" type="date" required>
      </label>
      <label><span data-i18n="time">Saat</span>
        <input name="time" type="time" required>
      </label>
      <label><span data-i18n="backfill.amount">Miktar</span>
        <select name="q">
          <option value="1" data-i18n="dose.1">¼ hap</option>
          <option value="2" data-i18n="dose.2">Yarım hap</option>
          <option value="4" data-i18n="dose.4">1 hap</option>
          <option value="6" data-i18n="dose.6">1,5 hap</option>
          <option value="8" data-i18n="dose.8">2 hap</option>
        </select>
      </label>

      <p id="backfill-error" class="error" hidden></p>

      <div class="actions sticky">
        <button type="button" id="backfill-cancel" class="btn ghost" data-i18n="cancel">Vazgeç</button>
        <button type="submit" class="btn primary" data-i18n="backfill.add">Ekle</button>
      </div>
    </form>
  </dialog>

  <dialog id="newbox-dialog">
    <form id="newbox-form" method="dialog">
      <h2 data-i18n="newbox.title">Yeni kutu</h2>
      <p id="newbox-note" class="hint"></p>

      <div class="grid2">
        <label><span data-i18n="form.blisters">Kutuda kaç blister?</span>
          <input name="blisters" type="number" min="1" max="50" required inputmode="numeric">
        </label>
        <label><span data-i18n="form.perBlister">Blisterde kaç hap?</span>
          <input name="perBlister" type="number" min="1" max="100" required inputmode="numeric">
        </label>
      </div>

      <label class="check">
        <input name="took" type="checkbox">
        <span id="newbox-took-label">Bugünkü dozu içtim</span>
      </label>
      <label id="newbox-time-row" hidden><span data-i18n="time">Saat</span>
        <input name="time" type="time">
      </label>

      <div class="actions sticky">
        <button type="button" id="newbox-cancel" class="btn ghost" data-i18n="cancel">Vazgeç</button>
        <button type="submit" class="btn primary" data-i18n="newbox.switch">Yeni kutuya geç</button>
      </div>
    </form>
  </dialog>

  <dialog id="extra-dialog">
    <form id="extra-form" method="dialog">
      <h2 data-i18n="extra.title">Ne içtin?</h2>

      <label><span data-i18n="extra.name">Adı</span>
        <input name="name" required maxlength="40" autocomplete="off" placeholder="Yaz ya da aşağıdan seç" data-i18n-placeholder="extra.placeholder">
      </label>
      <div id="extra-chips" class="chips wrap" aria-label="Önerilenler" data-i18n-aria="extra.suggestions"></div>

      <label><span data-i18n="extra.kind">Türü</span>
        <select name="kind">
          <option value="supplement" data-i18n="kind.supplement">Vitamin / takviye</option>
          <option value="tea" data-i18n="kind.tea">Bitki çayı</option>
          <option value="other" data-i18n="kind.other">Diğer</option>
        </select>
      </label>

      <label><span data-i18n="day">Gün</span>
        <input name="date" type="date" required>
      </label>
      <label><span data-i18n="time">Saat</span>
        <input name="time" type="time" required>
      </label>

      <div class="actions sticky">
        <button type="button" id="extra-cancel" class="btn ghost" data-i18n="cancel">Vazgeç</button>
        <button type="submit" class="btn primary" data-i18n="save">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
