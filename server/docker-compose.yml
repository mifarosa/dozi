# From the repository root:  docker compose -f server/docker-compose.yml up -d --build
services:
  dozi-notifier:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: always
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/serviceAccount.json
      DATA_DIR: /data
    volumes:
      - ./serviceAccount.json:/run/secrets/serviceAccount.json:ro
      - dozi-data:/data
volumes:
  dozi-data:
